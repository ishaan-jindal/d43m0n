[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d43m0n-sidecar"
version = "0.1.0"
description = "Local TabPFN predictor sidecar for d43m0n"
requires-python = ">=3.11"
dependencies = [
  "tabpfn==9.2.0",
  "numpy>=1.26",
  "pandas>=2.0",
]

[tool.setuptools]
packages = ["d43m0n_sidecar"]
