# Poltergeist canned whispers.
#
# Fallback bank used when the narrator is unavailable or its output fails
# validation. Rules (SRS FR-32/FR-35): one line, <= 12 words, terse/dry/eerie,
# no advice, no command text, no identity insults. The shell adds the glyph.
#
# Shape: [<level>.<kind>] for level1..level3 and [echo], each with `lines`.
# Echoes are pre-whispers ("this worked here before").

[level1.pre]
lines = [
  "The air grows thin here.",
  "Something remembers this command.",
  "A cold draft from the last attempt.",
  "I have seen this go wrong before.",
  "The room leans away from this one.",
  "Your fingers hesitate. I noticed.",
  "This path has teeth.",
  "Dust settles wrong on this command.",
]

[level1.post]
lines = [
  "It ended quietly. Too quietly.",
  "The dust settles. Nothing more.",
  "A door closes somewhere.",
  "I felt a small draft pass through.",
  "The last attempt still lingers.",
  "Something was here. It left.",
  "Quiet. For now.",
  "The floorboards remember a different ending.",
]

[level2.pre]
lines = [
  "Three failures. The walls remember each.",
  "This command has a history here.",
  "I hear the same door creaking again.",
  "The room is already bracing.",
  "You have walked into this wall before.",
  "The previous attempts left marks.",
  "It fails here. It has before.",
  "The hour is not on your side.",
]

[level2.post]
lines = [
  "Again. The same shape of failure.",
  "The silence afterward is familiar.",
  "I counted. It did not end well.",
  "The dark leans closer now.",
  "That is one more mark on the wall.",
  "The same dust, newly unsettled.",
  "I could have told you. I did, quietly.",
  "The pattern tightens around this place.",
]

[level3.pre]
lines = [
  "The hour is wrong. Everything here is wrong.",
  "This ends badly. I have watched it before.",
  "The walls are closer than they were.",
  "It is late. The house is awake.",
  "Every failure here has fed something.",
  "You are walking into the cold room.",
  "The dark has been waiting for this.",
  "Expect the same ending. It waits.",
]

[level3.post]
lines = [
  "It is done. The dark is not satisfied.",
  "The house took what it wanted.",
  "That failure echoed further than the last.",
  "The hour holds its breath.",
  "You are not alone in this room.",
  "Something exhaled. The walls are still.",
  "The marks on the wall deepen.",
  "The night writes this one down.",
]

[echo]
lines = [
  "This worked here. Some evenings ago.",
  "I remember it succeeding in this room.",
  "The dust here is from a better try.",
  "This one once ended well. Not lately.",
  "There was a day this worked.",
  "The walls remember a kinder ending.",
  "It worked before the dark settled here.",
  "The old marks are not all failures.",
]
