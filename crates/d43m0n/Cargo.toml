[package]
name = "d43m0n"
version = "0.1.0"
edition = "2021"
description = "Local-only terminal haunting"
license = "MIT"

[lib]
name = "d43m0n"
path = "src/lib.rs"

[[bin]]
name = "d43m0n"
path = "src/bin/d43m0n.rs"

[[bin]]
name = "d43m0nd"
path = "src/bin/d43m0nd.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
