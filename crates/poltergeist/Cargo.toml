[package]
name = "poltergeist"
version = "0.1.0"
edition = "2021"
description = "Local-only terminal haunting"
license = "MIT"

[lib]
name = "poltergeist"
path = "src/lib.rs"

[[bin]]
name = "poltergeist"
path = "src/bin/poltergeist.rs"

[[bin]]
name = "poltergeistd"
path = "src/bin/poltergeistd.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
